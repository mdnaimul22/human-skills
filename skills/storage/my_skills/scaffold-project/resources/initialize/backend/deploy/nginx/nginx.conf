events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server 127.0.0.1:8000;
    }

    # Rate limiting zone configuration using variables from settings.py
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        location /health {
            proxy_pass http://backend_servers/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            # Enforce rate limiting with burst and nodelay from settings.py
            limit_req zone=api_limit_zone burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
